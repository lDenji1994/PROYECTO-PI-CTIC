# =====================================================================
#  NGINX delante de la aplicacion (HTTPS)
#  Red Hat 10: copiar a /etc/nginx/conf.d/certificados.conf
#  Cambiar DOMINIO_DE_LA_WEB y las rutas del certificado SSL.
#
#  En Red Hat (SELinux activo) permitir que Nginx hable con la app:
#      sudo setsebool -P httpd_can_network_connect 1
#  Probar y recargar:
#      sudo nginx -t && sudo systemctl reload nginx
# =====================================================================

# Freno contra adivinar contrasenas: maximo 10 intentos de login por minuto por IP
limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;

# HTTP -> HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name DOMINIO_DE_LA_WEB;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name DOMINIO_DE_LA_WEB;

    # Certificado SSL (Let's Encrypt o el institucional)
    ssl_certificate     /etc/pki/tls/certs/certificados.crt;
    ssl_certificate_key /etc/pki/tls/private/certificados.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Cabeceras de seguridad
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    server_tokens off;

    # Archivos de hasta 20 MB (+ datos del formulario)
    client_max_body_size 25m;

    location = /api/auth/login {
        limit_req zone=login burst=5 nodelay;
        include /etc/nginx/conf.d/certificados-proxy.inc;
    }

    location / {
        include /etc/nginx/conf.d/certificados-proxy.inc;
    }
}
