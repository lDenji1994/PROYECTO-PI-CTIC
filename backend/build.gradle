// Spring Boot 4.1 (Spring Framework 7, Spring Security 7, Hibernate 7,
// Jackson 3, Tomcat 11). Requiere Java 17+ (se compila para 21) y
// Gradle 8.14+ o 9.x: el wrapper (gradlew) descarga solo la version correcta.
// Antes: 3.3.2, que dejo de recibir parches de seguridad gratuitos.
plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.certificados'
version = '0.0.1-SNAPSHOT'

// Se compila para Java 21 con el JDK que tenga instalado cada integrante
// (21, 22, 23...). Antes se exigia un "toolchain" 21 exacto y fallaba en
// equipos con otra version: "Cannot find a Java installation ... languageVersion=21".
java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

repositories {
    mavenCentral()
}

dependencies {
    // En Spring Boot 4 el starter "web" se llama "webmvc"
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-security'

    runtimeOnly 'com.mysql:mysql-connector-j'

    // Jackson 3 (Spring Boot 4) ya trae soporte de fechas (LocalDateTime):
    // ya no hace falta jackson-datatype-jsr310.

    implementation 'com.github.librepdf:openpdf:1.3.39'

    // Lombok se quito: fallaba con JDK recientes y ya no se usa en el proyecto.

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testRuntimeOnly 'com.h2database:h2'
}

tasks.named('test') {
    useJUnitPlatform()
}
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

// NO MODIFICAR: el JAR que va al servidor nunca debe llevar las credenciales
// locales de quien lo compilo (application-local.properties esta en la misma
// carpeta de recursos). Las del servidor se ponen fuera del JAR.
tasks.named('bootJar') {
    exclude '**/application-local.properties'
    archiveFileName = 'certificados-app.jar'
}
tasks.named('jar') {
    exclude '**/application-local.properties'
}
