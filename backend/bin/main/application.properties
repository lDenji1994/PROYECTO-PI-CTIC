# ============================
# Configuracion general
# ============================
spring.application.name=certificados-app
server.port=8080

# ============================
# Base de datos MySQL
# ============================
spring.datasource.url=jdbc:mysql://localhost:3306/certificados_db?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============================
# JPA / Hibernate
# ============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ============================
# Servir el frontend Angular (arquitectura monolitica)
# El build de Angular se copia a src/main/resources/static
# y Spring Boot lo sirve como recursos estaticos.
# ============================
spring.web.resources.static-locations=classpath:/static/
app.storage.upload-dir=build/test-uploads

# ============================
# CORS (solo para desarrollo, cuando Angular corre en 4200)
# ============================
app.cors.allowed-origins=http://localhost:4200
