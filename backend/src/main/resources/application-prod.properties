# =====================================================================
#  PERFIL DE PRODUCCION (servidor de la universidad)
#
#  Se activa al arrancar el JAR con:
#      java -jar certificados-app.jar --spring.profiles.active=prod
#  (ver deploy/certificados.service). En tu PC NO se usa: alli sigue
#  funcionando todo igual con application-local.properties.
#
#  Este archivo SI se sube a GitHub: NO escribir contrasenas aqui.
#  Las credenciales del servidor van en /etc/certificados/certificados.properties
#  (ver deploy/certificados.properties.example).
#
#  SE PUEDE MODIFICAR: rutas de logs y tamanos. NO MODIFICAR lo marcado.
# =====================================================================

# --- Detras de Nginx -------------------------------------------------
# Solo Nginx (en el mismo servidor) puede hablar con la aplicacion.
server.address=127.0.0.1
# Toma la IP real del usuario y el "https" de las cabeceras X-Forwarded-*
# que envia Nginx. Sin esto el bloqueo por intentos fallidos y la bitacora
# verian a todos los usuarios como 127.0.0.1. NO MODIFICAR.
server.forward-headers-strategy=native

# --- Cookies solo por HTTPS (sesion y token CSRF). NO MODIFICAR -------
server.servlet.session.cookie.secure=true

# --- Errores: nunca mostrar detalles internos al navegador -----------
spring.web.error.include-message=never
spring.web.error.include-binding-errors=never
spring.web.error.include-stacktrace=never

# --- Base de datos ----------------------------------------------------
# La URL, usuario y contrasena reales van en certificados.properties.
# La conexion con el servidor de base de datos debe ir CIFRADA:
#   jdbc:mysql://IP_SERVIDOR_BD:3306/CertificadosCursosAcademicosUPB?sslMode=REQUIRED&serverTimezone=America/Bogota&characterEncoding=UTF-8
# (sin useSSL=false ni allowPublicKeyRetrieval, que solo sirven en local)
spring.jpa.show-sql=false

# --- Actuator: solo /actuator/health ----------------------------------
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# --- Logs con rotacion (no llenan el disco) ---------------------------
logging.file.name=${LOG_FILE:/var/log/certificados/certificados.log}
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=14
logging.logback.rollingpolicy.total-size-cap=300MB
logging.level.root=INFO
