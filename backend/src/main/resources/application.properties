# =====================================================================
# CONFIGURACION DE LA APLICACION
# =====================================================================
spring.application.name=certificados-app

# Carga automaticamente, si existen:
#  - application-local.properties  -> credenciales de cada PC (desarrollo)
#  - /etc/certificados/certificados.properties -> credenciales del SERVIDOR
#    (fuera del JAR, con permisos 600; ver deploy/README-despliegue.md).
#    Se puede usar otra ruta con la variable CERTIFICADOS_CONFIG.
# Ninguno de los dos se sube a GitHub ni va dentro del JAR.
spring.config.import=optional:classpath:application-local.properties,optional:file:${CERTIFICADOS_CONFIG:/etc/certificados/certificados.properties}
server.port=${SERVER_PORT:8080}

# ============================
# Base de datos MySQL
# ============================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/CertificadosCursosAcademicosUPB?useSSL=false&serverTimezone=America/Bogota&allowPublicKeyRetrieval=true&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============================
# JPA / Hibernate
# ============================
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.naming.physical-strategy=com.certificados.app.config.LowerCaseTableNamingStrategy
spring.jpa.open-in-view=false

# ============================
# Panel web (HTML/CSS/JS plano servido por Spring Boot)
# ============================
spring.web.resources.static-locations=classpath:/static/

# ============================
# CORS
# ============================
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:8080,http://127.0.0.1:5500,http://localhost:5500}

# ============================
# Errores
# ============================
spring.web.error.include-message=always
spring.web.error.include-binding-errors=always
spring.web.error.include-stacktrace=never

# ============================
# Limite de tamano para carga de archivos
# ============================
spring.servlet.multipart.max-file-size=20MB
# La peticion completa = archivo (hasta 20 MB) + los datos del curso escritos a mano
spring.servlet.multipart.max-request-size=25MB
# Permite que el servidor responda "archivo muy pesado" en vez de cortar la conexion
server.tomcat.max-swallow-size=30MB
# Tomcat 11 limita por defecto cuantas partes trae un formulario con archivo;
# la carga de documentos envia el archivo + ~20 campos del curso. NO BAJAR.
server.tomcat.max-part-count=50
# Tomcat 11 limita a 512 bytes la cabecera de cada parte; un archivo con
# nombre largo fallaria. NO BAJAR.
server.tomcat.max-part-header-size=2KB

spring.servlet.encoding.charset=UTF-8
spring.servlet.encoding.enabled=true
spring.servlet.encoding.force=true

# =====================================================================
# FORMATOS DE DOCUMENTOS ACADEMICOS
# =====================================================================
app.formatos.catalogo=${FORMATOS_CATALOGO:DA-FO-085N:03:Carta descriptiva del curso:VIGENTE;DA-FO-763:2:Carta descriptiva del curso (version 2):ANTIGUO;SYLLABUS:1:Syllabus (formato antiguo):ANTIGUO;CONTENIDOS:1:Contenidos programaticos (formato antiguo):ANTIGUO;PROGRAMA:1:Programa academico (formato antiguo):ANTIGUO}

# =====================================================================
# BITACORA / ACTIVIDAD RECIENTE
# =====================================================================
app.auditoria.id-usuario-por-defecto=${AUDITORIA_ID_USUARIO:1}

# =====================================================================
# DOCUMENTOS: tipos de archivo que se pueden cargar  (SE PUEDE MODIFICAR)
# Solo extensiones que ArchivoDocumentoValidador sabe validar:
#   pdf, docx, doc, xlsx, xlsm, xls
# =====================================================================
app.documentos.extensiones-permitidas=${DOCUMENTOS_EXTENSIONES:pdf,docx,doc,xlsx,xlsm,xls}

# =====================================================================
# LOGIN Y SESION
#
# NO escribir contrasenas aqui: este archivo se sube a GitHub.
# El administrador inicial se define en application-local.properties
# (ver application-local.properties.example):
#     app.seguridad.admin-inicial.usuario=admin
#     app.seguridad.admin-inicial.contrasena=...
# Las auxiliares las crea el administrador desde el panel (Usuarios).
# =====================================================================
# Maximo de auxiliares activas (SE PUEDE MODIFICAR; 0 = sin limite)
app.seguridad.max-auxiliares=${MAX_AUXILIARES:4}
# Largo minimo de las contrasenas (politica de CTIC: 12). Se puede subir;
# si se pone un numero menor a 12, el sistema igual exige 12.
app.seguridad.contrasena-minima=${CONTRASENA_MINIMA:12}
# Intentos fallidos antes de bloquear el usuario, y minutos de bloqueo
app.seguridad.intentos-maximos=5
app.seguridad.minutos-bloqueo=5

# La sesion se cierra tras este tiempo sin actividad
server.servlet.session.timeout=60m
# Cookie de sesion: no accesible desde JavaScript y solo para este sitio.
# SameSite=Strict + token CSRF (SecurityConfig) protegen contra CSRF: NO QUITAR.
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict

# Verificacion del token CSRF en cada POST/PUT/PATCH/DELETE (SecurityConfig).
# NO MODIFICAR: poner false solo para depurar, nunca en el servidor.
app.seguridad.csrf-activo=${CSRF_ACTIVO:true}
