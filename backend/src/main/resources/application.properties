# =====================================================================
#  CONFIGURACION DE LA APLICACION
#
#  REGLA DEL EQUIPO: aqui NO se escriben contrasenas reales.
#  Cada integrante define sus credenciales de MySQL con variables de
#  entorno (DB_URL, DB_USERNAME, DB_PASSWORD) o en un archivo
#  "application-local.properties" en esta misma carpeta (ignorado por
#  git, ver application-local.properties.example). Ese archivo se carga
#  solo: basta con  gradle bootRun
# =====================================================================
spring.application.name=certificados-app

# Carga automaticamente application-local.properties (tus credenciales) si
# existe, sin tener que activar el perfil "local". NO MODIFICAR.
spring.config.import=optional:classpath:application-local.properties
server.port=${SERVER_PORT:8080}

# ============================
# Base de datos MySQL
# (SE PUEDE MODIFICAR con variables de entorno, sin tocar este archivo)
# ============================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/CertificadosCursosAcademicosUPB?useSSL=false&serverTimezone=America/Bogota&allowPublicKeyRetrieval=true&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============================
# JPA / Hibernate
# NO MODIFICAR ddl-auto: el esquema lo define el script SQL del equipo.
# "validate" solo comprueba que las entidades coincidan con las tablas.
# ============================
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.naming.physical-strategy=com.certificados.app.config.LowerCaseTableNamingStrategy
spring.jpa.open-in-view=false

# ============================
# Panel web (HTML/CSS/JS plano servido por Spring Boot)
# ============================
spring.web.resources.static-locations=classpath:/static/

# ============================
# CORS: solo hace falta si el panel se abre desde OTRO origen
# (p. ej. Live Server en :5500). Lista separada por comas.
# ============================
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:8080,http://127.0.0.1:5500,http://localhost:5500}

# ============================
# Errores: nunca exponer trazas internas al navegador
# ============================
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=never

# ============================
# Limite de tamano para carga de archivos
# ============================
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# =====================================================================
#  FORMATOS DE DOCUMENTOS ACADEMICOS  (SE PUEDE MODIFICAR)
#
#  Catalogo que ve el panel en "Carga de informacion". Formato de cada
#  entrada:   CODIGO:VERSION:Nombre visible:VIGENTE|ANTIGUO
#  separadas por punto y coma. Cuando la universidad publique una
#  version nueva de la carta descriptiva, basta con agregarla aqui como
#  VIGENTE y pasar la anterior a ANTIGUO: el panel marcara
#  automaticamente como "Desactualizado" todo documento cargado con un
#  formato que no este marcado como VIGENTE.
# =====================================================================
app.formatos.catalogo=${FORMATOS_CATALOGO:DA-FO-085N:03:Carta descriptiva del curso:VIGENTE;DA-FO-763:2:Carta descriptiva del curso (version 2):ANTIGUO;SYLLABUS:1:Syllabus (formato antiguo):ANTIGUO;CONTENIDOS:1:Contenidos programaticos (formato antiguo):ANTIGUO;PROGRAMA:1:Programa academico (formato antiguo):ANTIGUO}

# =====================================================================
#  BITACORA / ACTIVIDAD RECIENTE  (SE PUEDE MODIFICAR)
#
#  La tabla de Logs exige un usuario. Mientras no exista login real,
#  las acciones se registran a nombre de este usuario (debe existir en
#  la tabla de usuarios). Si no existe, la accion se hace igual pero no
#  queda en la bitacora (se avisa en la consola del servidor).
# =====================================================================
app.auditoria.id-usuario-por-defecto=${AUDITORIA_ID_USUARIO:1}
