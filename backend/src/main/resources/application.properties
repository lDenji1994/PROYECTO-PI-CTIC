# =====================================================================
# CONFIGURACION DE LA APLICACION
# =====================================================================
spring.application.name=certificados-app

# Carga automaticamente application-local.properties si existe
spring.config.import=optional:classpath:application-local.properties
server.port=${SERVER_PORT:8080}

# ============================
# Base de datos MySQL
# ============================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/CertificadosCursosAcademicosUPB?useSSL=false&serverTimezone=America/Bogota&allowPublicKeyRetrieval=true&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:2403}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============================
# JPA / Hibernate
# ============================
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.naming.physical-strategy=com.certificados.app.config.LowerCaseTableNamingStrategy
spring.jpa.open-in-view=false

# ============================
# Panel web (HTML/CSS/JS plano servido por Spring Boot)
# ============================
spring.web.resources.static-locations=classpath:/static/

# ============================
# CORS
# ============================
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:8080,http://127.0.0.1:5500,http://localhost:5500}

# ============================
# Errores
# ============================
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=never

# ============================
# Limite de tamano para carga de archivos
# ============================
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# =====================================================================
# FORMATOS DE DOCUMENTOS ACADEMICOS
# =====================================================================
app.formatos.catalogo=${FORMATOS_CATALOGO:DA-FO-085N:03:Carta descriptiva del curso:VIGENTE;DA-FO-763:2:Carta descriptiva del curso (version 2):ANTIGUO;SYLLABUS:1:Syllabus (formato antiguo):ANTIGUO;CONTENIDOS:1:Contenidos programaticos (formato antiguo):ANTIGUO;PROGRAMA:1:Programa academico (formato antiguo):ANTIGUO}

# =====================================================================
# BITACORA / ACTIVIDAD RECIENTE
# =====================================================================
app.auditoria.id-usuario-por-defecto=${AUDITORIA_ID_USUARIO:1}