# ============================
# Configuracion general
# ============================
spring.application.name=certificados-app
server.port=8080

# ============================
# Base de datos MySQL (Localhost)
# ============================
spring.datasource.url=jdbc:mysql://localhost:3307/CertificadosCursosAcademicosUPB?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=D@vid2104551835
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============================
# JPA / Hibernate
# ============================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.naming.physical-strategy=com.certificados.app.config.LowerCaseTableNamingStrategy

# ============================
# Servir el frontend Angular (arquitectura monolitica)
# ============================
spring.web.resources.static-locations=classpath:/static/
app.storage.upload-dir=uploads

# ============================
# CORS
# ============================
app.cors.allowed-origins=http://localhost:4200

server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=never

# ============================
# Limite de tamano para carga de archivos
# ============================
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true